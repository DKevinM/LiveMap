 <!DOCTYPE html>
<html>
<head>
  <title>Live Air Quality Monitoring – ACA &amp; WCAS</title>
  <meta charset="utf-8"/>


  <style>

  /* Hide AQHI panel */
  #panel {
    display: none !important;
  }

  /* Hide Clear Selection button */
  #clear-btn {
    display: none !important;
  }

  /* Hide address search */
  #addressInput,
  button[onclick="lookupAddress()"] {
    display: none !important;
  }

  /* Hide center instructions */
  #header-center {
    display: none !important;
  }


  .leaflet-control-layers {
      display: none !important;
  }


  /* Stretch app */
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  /* Make app use full screen */
  #app {
    width: 100vw !important;
    height: calc(100vh - 50px) !important;
    display: block !important;
  }

  /* Force map to occupy all available space */
  #map {
    width: 100vw !important;
    height: calc(100vh - 50px) !important;
  }

  /* Center title */
  #header-left {
    width: 100%;
    text-align: center;
  }

  </style>


  <script>
    window.APP_CONFIG = {
      airshed: "ACA_WCAS",
      title: "Live Air Quality Monitoring – ACA & WCAS",


      enableHistory: true,

      // Stations + PurpleAir only for this display — no AQHI grid overlay.
      overlays: [
        "stations",
        "purpleair"
      ]

      // No aqhi / defaultAQHI here on purpose: leaving both unset means
      // loadAQHIGroup() is never called on load, so no grid layer is ever
      // added to the map (see js/render.js renderMap()).
    };
  </script>


  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>


</head>
<body>
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>


<div id="header">
  <div id="header-left">
    Live Air Quality Monitoring – ACA &amp; WCAS
  </div>

  <div id="header-center">
    Click anywhere on the map to identify nearby stations, sensors, and weather
  </div>

  <div id="header-right"></div>
</div>

<div style="position:absolute; top:8px; right:25px; z-index:1000;">
  <input id="addressInput" type="text" placeholder="Enter address..."
         style="padding:6px; width:250px;" />
  <button onclick="lookupAddress()">Go</button>
</div>

<div id="app">
  <div id="map"></div>

  <div id="panel">
    <div id="aqhi-panel">
      <div id="aqhi-content"></div>
    </div>
    <div id="station-gauges"></div>
  </div>

</div>

<button onclick="clearSelection()" id="clear-btn">
  Clear Selection
</button>

<!-- 1. DATA -->
<script src="js/data.js" defer></script>

<!-- 2. CORE LOGIC (used everywhere) -->
<script src="js/aqhi.js" defer></script>
<script src="js/click_utils.js" defer></script>

<!-- 4. RENDERERS -->
<script src="js/render.js" defer></script>
  <!-- 3. MAP + LAYERS -->
<script src="js/map.js" defer></script>

<script src="js/purpleair.js" defer></script>

<!-- 5. WEATHER -->
<script src="js/weather.js" defer></script>

<!-- 6. INTERACTION -->
<script src="js/click_engine.js" defer></script>

<!-- 7. UI -->
<script src="js/ui.js" defer></script>

<!-- 9. GEOCODE -->
<script src="js/geocode.js" defer></script>

<script>
window.addEventListener("load", function() {
  setTimeout(function() {
    if (window.map) {

      // Combined ACA + WCAS extent (union of each airshed page's own
      // bounds), instead of WallMap.html's full-Alberta fitBounds.
      map.fitBounds([
        [52.7, -118.5],
        [54.8, -111.5]
      ]);

      map.invalidateSize(true);

    }
  }, 2000);
});
</script>

<!-- 8. START -->
<script src="js/main.js"></script>


<script>
window.addEventListener("load", function () {

  // Only the two airsheds this display is zoomed to — the other 8 outlines
  // would just be off-screen clutter and unnecessary fetches at this extent.
  const airsheds = [
    "ACA",
    "WCAS"
  ];

  airsheds.forEach(name => {

    let style = {
      color: "#000000",
      weight: 6,
      opacity: 1,
      fillOpacity: 0
    };

    fetch(`airshed/${name}.geojson`)
      .then(r => r.json())
      .then(data => {

        L.geoJSON(data, {
          style: style
        }).addTo(map);

      })
      .catch(err => console.log(`Failed to load ${name}`, err));

  });

});
</script>

</body>
</html>
