<!-- PAZA boundary - loaded independently rather than via the shared
     showACABoundary/showWCASBoundary flags in map.js/render.js, so this
     page doesn't require changes to code the other airshed pages depend on -->
<script>
window.addEventListener("load", function () {
  setTimeout(function() {
    if (!window.map) return;

    fetch("airshed/PAZA.geojson")
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            color: "#000000",
            weight: 4,
            opacity: 1,
            fillOpacity: 0
          }
        }).addTo(map);
      })
      .catch(err => console.log("Failed to load PAZA boundary", err));
  }, 1500);
});
</script>

<!-- AQHI "DNA" driver chart. The actual station popup is built in the
     SHARED js/render.js (inside renderMap()'s per-station loop) - it
     places an empty placeholder div in the popup HTML and fires
     window.renderDNAChartInto(...) on Leaflet's popupopen event, but
     only when window.APP_CONFIG.showDNAChart is true. That keeps the
     shared file's behavior byte-for-byte identical on pages that don't
     set this flag while the actual chart-drawing logic below stays
     local to this page (same block as WCAS.html/ACA.html/index.html).

     Decomposes the real AQHI formula:
       AQHI = (1000/10.4) * [exp(0.000537*O3) + exp(0.000871*NO2)
                              + exp(0.000487*PM2.5) - 3]
     into each pollutant's share of the total (each term's value above
     its zero-concentration floor of 1, as a fraction of the sum) - not
     a historical-max normalization, which would show how unusual each
     pollutant is for that station rather than what's actually driving
     today's number. -->
<script>
function computeAQHIDrivers(no2, o3, pm25) {
  const tNO2 = Math.exp(0.000871 * no2) - 1;
  const tO3 = Math.exp(0.000537 * o3) - 1;
  const tPM25 = Math.exp(0.000487 * pm25) - 1;
  const total = tNO2 + tO3 + tPM25;
  if (!isFinite(total) || total <= 0) return null;
  return {
    NO2: 100 * tNO2 / total,
    O3: 100 * tO3 / total,
    "PM2.5": 100 * tPM25 / total
  };
}

// containerId: the placeholder div's id, already in the DOM (popupopen
// already fired by the time this runs). rows: this station's full
// parameter rows (same shape used to build the rest of the popup).
// aqhiVal: this station's current AQHI, already computed by render.js.
window.renderDNAChartInto = function (containerId, rows, aqhiVal) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const byParam = {};
  (rows || []).forEach(r => { byParam[r.ParameterName] = r; });

  const no2 = byParam["Nitrogen Dioxide"]?.Value;
  const o3 = byParam["Ozone"]?.Value;
  const pm25 = byParam["Fine Particulate Matter"]?.Value;

  if (no2 == null || o3 == null || pm25 == null) return; // station doesn't report all three - skip silently

  const shares = computeAQHIDrivers(Number(no2), Number(o3), Number(pm25));
  if (!shares) return;

  const label = document.createElement("div");
  label.style.fontWeight = "600";
  label.style.fontSize = "12px";
  label.style.marginBottom = "4px";
  label.textContent = "What's driving this AQHI";
  container.appendChild(label);

  const plotDiv = document.createElement("div");
  plotDiv.style.margin = "0 auto";
  container.appendChild(plotDiv);

  const theta = ["NO2", "O3", "PM2.5", "NO2"];
  const r = [shares.NO2, shares.O3, shares["PM2.5"], shares.NO2];
  const aqhiLabel = (aqhiVal != null && isFinite(aqhiVal)) ? (aqhiVal > 10 ? "10+" : Math.round(aqhiVal)) : "—";

  Plotly.newPlot(plotDiv, [{
    type: "scatterpolar",
    r: r,
    theta: theta,
    fill: "toself",
    hovertemplate: "%{theta}: %{r:.0f}%<extra></extra>"
  }], {
    title: { text: `AQHI: ${aqhiLabel}`, font: { size: 11 } },
    polar: {
      radialaxis: { visible: true, range: [0, 100], tickvals: [0, 50, 100], ticktext: ["0%", "50%", "100%"] }
    },
    showlegend: false,
    margin: { t: 24, b: 22, l: 30, r: 30 },
    height: 175,
    width: 200
  }, { displayModeBar: false });
};
</script>

<!-- PAZA stations NOT reporting to government (2026-11-25, Kevin). They are in
     no live feed, so the shared code never draws them; shown here as hollow
     dashed circles with what each one measures (AB_datapull/data/PAZA_equipment.csv).
     Same stations and coordinates as the PAZA emergency map (build_live.py). -->
<script>
(function () {
  const NOT_REPORTING = [
    { name: "Dunes", lat: 55.1022, lon: -118.7726,
      measures: "SO2, PM2.5, TRS, temperature, humidity, wind" },
    { name: "Milner", lat: 54.0143, lon: -119.0916,
      measures: "NO, NO2, NOx, PM2.5, wind" },
    { name: "Valleyview", lat: 54.9405, lon: -117.2153,
      measures: "SO2, H2S, temperature, humidity, wind" }
  ];
  function whenReady(fn) { if (window.map && window._layerControl) fn(); else setTimeout(() => whenReady(fn), 300); }
  whenReady(function () {
    const layer = L.layerGroup();
    NOT_REPORTING.forEach(st => {
      L.circleMarker([st.lat, st.lon], {
        radius: 14, color: "#555", weight: 2, dashArray: "4 4",
        fillColor: "#ffffff", fillOpacity: 0.9, bubblingMouseEvents: false
      })
        .bindTooltip(st.name + " (not reporting to government)", { direction: "top" })
        .bindPopup(
          "<b>" + st.name + "</b> &ndash; PAZA station<br>" +
          "<b>Not reporting to government.</b> Its readings are not in Alberta&rsquo;s " +
          "live feed, so there is no live reading on this map.<br>" +
          "<small>Measures: " + st.measures + "</small>")
        .addTo(layer);
    });
    layer.addTo(window.map);
    window._layerControl.addOverlay(layer, "PAZA stations not reporting to government");
  });
})();
</script>
