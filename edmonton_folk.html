<!DOCTYPE html>
<html>
<head>
  <title>Edmonton Folk Music Festival Environmental Intelligence</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    window.APP_CONFIG = {
      airshed: "Edmonton_Folk",
      title: "Edmonton Folk Music Festival Environmental Intelligence",

      excludeStations: [],

      enableHistory: true,

      // Edmonton Region
      bounds: [
        [53.25, -113.95],
        [53.80, -113.05]
      ],

      lockBounds: false,
      minZoom: 9,
      maxZoom: 20,

      // Gallagher Park
      center: [53.5352, -113.4787],
      zoom: 11,

      showACABoundary: false,

      overlays: [
        "stations",
        "purpleair",

        "weather_radar",
        "weather_wind_u",
        "weather_lightning",
        "weather_thunderstorm",

        "firesmoke_now",
        "firesmoke_6h",
        "firesmoke_12h",
        "firesmoke_24h",

        "aqhi_forecast_3h"
      ],

      defaultAQHI: [
        "Alberta_BLEND"
      ],

      aqhi: [
        "Alberta",
        "Alberta_BLEND",
        "Alberta_FORECAST_3H"
      ]
    };
  </script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

</head>

<body>

<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<div id="header">

  <div id="header-left">
    Edmonton Folk Music Festival Environmental Intelligence
  </div>

  <div id="header-center">
    Current and 3-hour forecast air quality, wildfire smoke, weather, lightning, and environmental conditions for Gallagher Park.
  </div>

  <div id="header-right"></div>

</div>

<!-- Address Search -->

<div id="search-box">
  <input
      id="addressInput"
      type="text"
      placeholder="Enter address..."
      style="padding:6px; width:250px;" />

  <button onclick="lookupAddress()">
      Go
  </button>
</div>

<div id="app">

  <div id="map"></div>

  <div id="panel">

      <div id="aqhi-panel">
          <div id="aqhi-content"></div>
      </div>

      <div id="station-gauges"></div>

  </div>

</div>

<button onclick="clearSelection()" id="clear-btn">
    Clear Selection
</button>

<!-- DATA -->

<script src="js/data.js" defer></script>

<!-- CORE -->

<script src="js/aqhi.js" defer></script>
<script src="js/click_utils.js" defer></script>

<!-- RENDER -->

<script src="js/render.js" defer></script>

<!-- MAP -->

<script src="js/map.js" defer></script>

<!-- OTHER -->

<script src="js/purpleair.js" defer></script>
<script src="js/weather.js" defer></script>
<script src="js/click_engine.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/geocode.js" defer></script>

<!-- START -->


<script src="js/main.js"></script>

<!-- Edmonton Folk Festival Enhancements -->
<script>

window.addEventListener("load", () => {

    const festival = {
        lat: 53.5352,
        lng: -113.4787,
        name: "Edmonton Folk Music Festival",
        venue: "Gallagher Park"
    };

    // Wait until the shared map has been created
    const timer = setInterval(() => {

        if (typeof map === "undefined") return;

        clearInterval(timer);

        //-------------------------------------------------
        // Festival Marker
        //-------------------------------------------------

        const marker = L.marker([festival.lat, festival.lng], {

            title: festival.name

        }).addTo(map);

        marker.bindPopup(
            `<h3 style="margin-bottom:5px;">🎵 ${festival.name}</h3>
             <b>${festival.venue}</b><br>
             Event Environmental Intelligence Monitoring Location`
        );

        //-------------------------------------------------
        // Analysis Zones
        //-------------------------------------------------

        const immediateAreaCircle = L.circle([festival.lat, festival.lng], {
            radius: 2000,
            color: "#00B050",
            weight: 3,
            fillColor: "#00B050",
            fillOpacity: 0.05
        })
        .addTo(map)
        .bindTooltip("2 km Immediate Event Area");

        L.circle([festival.lat, festival.lng], {
            radius: 5000,
            color: "#FFC000",
            weight: 2,
            dashArray: "8 8",
            fillOpacity: 0.03
        })
        .addTo(map)
        .bindTooltip("5 km Monitoring Area");

        L.circle([festival.lat, festival.lng], {
            radius: 10000,
            color: "#D32F2F",
            weight: 2,
            dashArray: "12 10",
            fillOpacity: 0.02
        })
        .addTo(map)
        .bindTooltip("10 km Regional Intelligence Area");

        //-------------------------------------------------
        // Focus on the Festival - start zoomed to the green
        // (2 km Immediate Event Area) circle
        //-------------------------------------------------

        map.fitBounds(immediateAreaCircle.getBounds(), {
            padding: [20, 20]
        });

        marker.openPopup();

    }, 100);

});

</script>

</body>
</html>
