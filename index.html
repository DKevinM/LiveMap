<!DOCTYPE html>
<html>
<head>
  <title>Live Air Quality Monitoring – Alberta</title>
  <meta charset="utf-8"/>

  <!-- Provincial map config (must be BEFORE scripts) -->
  <script>
    window.APP_CONFIG = {
      airshed: "ALL",
      title: "Live Air Quality Monitoring – Alberta"
    };
  </script>

  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  
</head>
<body>
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>
  

<div id="header">
  <div id="header-left">
    Live Air Quality Monitoring – Alberta
  </div>

  <div id="header-center">
    Click anywhere on the map to identify nearby stations, sensors, and weather
  </div>

  <div id="header-right"></div>
</div>



<div id="app">
  <div id="map"></div>

  <div id="panel"> 
    <div id="aqhi-panel">
      <div id="aqhi-content"></div>
    </div>
    <div id="station-gauges"></div>
  </div>

</div>
  
<button onclick="clearSelection()" style="margin:6px;">
  Clear Selection
</button>
  
<!-- ============================= -->
<!-- 1. DATA (NO LEAFLET) -->
<!-- ============================= -->
<script src="js/data.js" defer></script>

<!-- ============================= -->
<!-- 2. LAYER BUILDERS (NO DATA) -->
<!-- ============================= -->
<script src="js/map.js" defer></script>

<!-- ============================= -->
<!-- 3. DATA → LAYER RENDER -->
<!-- ============================= -->
<script src="js/render.js" defer></script>
<script src="js/purpleair.js" defer></script>
<script src="js/stations.js" defer></script>

<!-- ============================= -->
<!-- 4. AQHI SYSTEM -->
<!-- ============================= -->
<script src="js/aqhi.js" defer></script>

<!-- ============================= -->
<!-- 5. WEATHER -->
<!-- ============================= -->
<script src="js/weather.js" defer></script>

<!-- ============================= -->
<!-- 6. INTERACTION -->
<!-- ============================= -->
<script src="js/click_utils.js" defer></script>
<script src="js/click_engine.js" defer></script>

<!-- ============================= -->
<!-- 7. UI -->
<!-- ============================= -->
<script src="js/ui.js" defer></script>

<!-- ============================= -->
<!-- 8. APP START (ALWAYS LAST) -->
<!-- ============================= -->
<script src="js/main.js"></script>


</body>
</html>
