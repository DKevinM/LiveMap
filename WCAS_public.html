<!-- AQHI "DNA" driver chart. The actual station popup is built in the
     SHARED js/render.js (inside renderMap()'s per-station loop) - it
     places an empty placeholder div in the popup HTML and fires
     window.renderDNAChartInto(...) on Leaflet's popupopen event, but
     only when window.APP_CONFIG.showDNAChart is true. That keeps the
     shared file's behavior byte-for-byte identical on every other page
     (ACA.html/etc never set that flag) while the actual chart-drawing
     logic below stays local to this page.

     Decomposes the real AQHI formula:
       AQHI = (1000/10.4) * [exp(0.000537*O3) + exp(0.000871*NO2)
                              + exp(0.000487*PM2.5) - 3]
     into each pollutant's share of the total (each term's value above
     its zero-concentration floor of 1, as a fraction of the sum) - not
     a historical-max normalization, which would show how unusual each
     pollutant is for that station rather than what's actually driving
     today's number. -->
<script>
function computeAQHIDrivers(no2, o3, pm25) {
  const tNO2 = Math.exp(0.000871 * no2) - 1;
  const tO3 = Math.exp(0.000537 * o3) - 1;
  const tPM25 = Math.exp(0.000487 * pm25) - 1;
  const total = tNO2 + tO3 + tPM25;
  if (!isFinite(total) || total <= 0) return null;
  return {
    NO2: 100 * tNO2 / total,
    O3: 100 * tO3 / total,
    "PM2.5": 100 * tPM25 / total
  };
}

// containerId: the placeholder div's id, already in the DOM (popupopen
// already fired by the time this runs). rows: this station's full
// parameter rows (same shape used to build the rest of the popup).
// aqhiVal: this station's current AQHI, already computed by render.js.
window.renderDNAChartInto = function (containerId, rows, aqhiVal) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const byParam = {};
  (rows || []).forEach(r => { byParam[r.ParameterName] = r; });

  const no2 = byParam["Nitrogen Dioxide"]?.Value;
  const o3 = byParam["Ozone"]?.Value;
  const pm25 = byParam["Fine Particulate Matter"]?.Value;

  if (no2 == null || o3 == null || pm25 == null) return; // station doesn't report all three - skip silently

  const shares = computeAQHIDrivers(Number(no2), Number(o3), Number(pm25));
  if (!shares) return;

  const label = document.createElement("div");
  label.style.fontWeight = "600";
  label.style.fontSize = "12px";
  label.style.marginBottom = "4px";
  label.textContent = "What's driving this AQHI";
  container.appendChild(label);

  const plotDiv = document.createElement("div");
  container.appendChild(plotDiv);

  const theta = ["NO2", "O3", "PM2.5", "NO2"];
  const r = [shares.NO2, shares.O3, shares["PM2.5"], shares.NO2];
  const aqhiLabel = (aqhiVal != null && isFinite(aqhiVal)) ? (aqhiVal > 10 ? "10+" : Math.round(aqhiVal)) : "—";

  Plotly.newPlot(plotDiv, [{
    type: "scatterpolar",
    r: r,
    theta: theta,
    fill: "toself",
    hovertemplate: "%{theta}: %{r:.0f}%<extra></extra>"
  }], {
    title: { text: `AQHI: ${aqhiLabel}`, font: { size: 11 } },
    polar: {
      radialaxis: { visible: true, range: [0, 100], ticksuffix: "%" }
    },
    showlegend: false,
    margin: { t: 30, b: 16, l: 36, r: 36 },
    height: 230,
    width: 280
  }, { displayModeBar: false });
};
</script>
