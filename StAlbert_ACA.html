      ],

      minZoom: 11,

        "firesmoke_now",
        "firesmoke_6h",

      ],
    
      aqhi: [
        "ACA_Boundary_2022",
        "ACA_Boundary_2022_BLEND"
      ],
      defaultAQHI: ["ACA_Boundary_2022"],

      focus: {
        lat: 53.6320,
        lon: -113.6286,
        zoom: 15
      }
    };
  </script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="js/click_utils.js" defer></script>

<script>
  window.addEventListener("load", function () {
    function distanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function withinFocus(item) {
      const focus = window.APP_CONFIG?.focus;
      if (!focus) return true;

      const lat = Number(item?.lat);
      const lon = Number(item?.lon ?? item?.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;

      return distanceKm(focus.lat, focus.lon, lat, lon) <= focus.radiusKm;
    }

    if (!window.AppData || !window.AppData.ready) {
      console.error("AppData not ready in StAlbert_ACA.html");
      return;
    }

    const originalReady = window.AppData.ready;

    window.AppData.ready = (async () => {
      await originalReady;

      window.AppData.stations = (window.AppData.stations || []).filter(withinFocus);
      window.AppData.purpleair = (window.AppData.purpleair || []).filter(withinFocus);

      window.STATIONS_FC = {
        type: "FeatureCollection",
        features: (window.AppData.stations || []).map(s => ({
          type: "Feature",
          properties: s,
          geometry: { type: "Point", coordinates: [s.lon, s.lat] }
        }))
      };

      window.PURPLE_FC = {
        type: "FeatureCollection",
        features: (window.AppData.purpleair || []).map(p => ({
          type: "Feature",
          properties: p,
          geometry: { type: "Point", coordinates: [p.lon, p.lat] }
        }))
      };
    })();
  });
</script>

<script src="js/render.js" defer></script>
<script src="js/map.js" defer></script>
<script src="js/purpleair.js" defer></script>
<script src="js/weather.js" defer></script>

</html>
